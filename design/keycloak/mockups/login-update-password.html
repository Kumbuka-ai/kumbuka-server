<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password · kumbuka.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../keycloak.css">
</head>
<body>
<!-- maps to: login-update-password.ftl  (template "login-update-password") — forced credential update -->
<div class="kc-page">
  <div class="kc-shell">
    <div class="kc-brand">
      <img src="../../../assets/brand/kumbuka-mark.svg" alt="">
      <div><div class="wordmark">kumbuka<span class="dot">.ai</span></div><span class="sub">memory console</span></div>
    </div>

    <div class="kc-card">
      <span class="kc-eyebrow">// update password</span>
      <h1 class="kc-title">Set a new password</h1>

      <!-- ${kcSanitize(message.summary)} — why the user is here -->
      <div class="kc-alert info" style="margin-top:22px;margin-bottom:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        <span>Your administrator asked you to choose a new password before continuing.</span>
      </div>

      <!-- #kc-passwd-update-form -->
      <form class="kc-form" action="#" method="post" onsubmit="return false" style="margin-top:24px">
        <div class="kc-field">
          <label class="kc-label" for="password-new">New password</label>
          <div class="kc-input-wrap">
            <input class="kc-input" id="password-new" name="password-new" type="password" autocomplete="new-password" placeholder="At least 12 characters">
            <button type="button" class="kc-reveal" aria-label="Show password" onclick="(function(b){var i=document.getElementById('password-new');var s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-label',s?'Hide password':'Show password');})(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7"/><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg>
            </button>
          </div>
          <span class="kc-input-error" style="color:var(--c-muted)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
            12+ characters, with a number and a symbol.
          </span>
        </div>
        <div class="kc-field">
          <label class="kc-label" for="password-confirm">Confirm new password</label>
          <div class="kc-input-wrap">
            <input class="kc-input" id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="Re-enter the password">
            <button type="button" class="kc-reveal" aria-label="Show password" onclick="(function(b){var i=document.getElementById('password-confirm');var s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-label',s?'Hide password':'Show password');})(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7"/><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg>
            </button>
          </div>
        </div>
        <label class="kc-checkbox" style="margin-top:-2px">
          <input type="checkbox" name="logout-sessions" checked>
          <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
          <span class="lbl">Sign out of other devices</span>
        </label>
        <button class="kc-btn primary" type="submit">
          Update password
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
