<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a method · kumbuka.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../keycloak.css">
</head>
<body>
<!-- maps to: select-authenticator.ftl  (template "select-authenticator") — choice list -->
<div class="kc-page">
  <div class="kc-shell">

    <div class="kc-brand">
      <img src="../../../assets/brand/kumbuka-mark.svg" alt="">
      <div>
        <div class="wordmark">kumbuka<span class="dot">.ai</span></div>
        <span class="sub">memory console</span>
      </div>
    </div>

    <div class="kc-card">
      <span class="kc-eyebrow">// verify your identity</span>
      <h1 class="kc-title">Choose how to continue</h1>
      <p class="kc-lead">Pick one of the second factors set up on your account.</p>

      <!-- form#kc-select-credential-form — each ${authenticationSelections} is a submit -->
      <div class="kc-choices" style="margin-top:26px">
        <button class="kc-choice" type="submit">
          <span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a2 2 0 0 0-2 2c0 2 .5 3.5 1 4.5"/><path d="M8 7.5A6 6 0 0 1 18 12v1a14 14 0 0 0 .5 4"/><path d="M5 12a7 7 0 0 1 2-5"/><path d="M12 13c0 2.5.5 4.5 1.5 6"/><path d="M15.5 12.5a3.5 3.5 0 0 0-7 .5"/></svg></span>
          <span>
            <span class="ch-name">Passkey or security key</span>
            <span class="ch-sub">Face ID, Touch ID, or a hardware key</span>
          </span>
          <span class="ch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>

        <button class="kc-choice" type="submit">
          <span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7z"/><path d="M11 18h2"/></svg></span>
          <span>
            <span class="ch-name">Authenticator app</span>
            <span class="ch-sub">6-digit code from your TOTP app</span>
          </span>
          <span class="ch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>

        <button class="kc-choice" type="submit">
          <span class="ch-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg></span>
          <span>
            <span class="ch-name">Email a one-time code</span>
            <span class="ch-sub">Sent to yo•••@kumbuka.ai</span>
          </span>
          <span class="ch-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>
      </div>
    </div>

    <a class="kc-back" href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 5l-7 7 7 7"/></svg>
      Back to sign in
    </a>

  </div>
</div>
</body>
</html>
