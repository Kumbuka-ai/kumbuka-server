<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong · kumbuka.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../keycloak.css">
</head>
<body>
<!-- maps to: error.ftl  (template "error") — the unglamorous one, branded -->
<div class="kc-page">
  <div class="kc-shell">

    <div class="kc-brand">
      <img src="../../../assets/brand/kumbuka-mark.svg" alt="">
      <div>
        <div class="wordmark">kumbuka<span class="dot">.ai</span></div>
        <span class="sub">memory console</span>
      </div>
    </div>

    <div class="kc-card">
      <div class="kc-hero-ico bad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 20h20z"/><path d="M12 9v5"/><path d="M12 17h.01"/></svg>
      </div>
      <span class="kc-eyebrow">// error</span>
      <h1 class="kc-title">Something went wrong</h1>
      <!-- ${message.summary} -->
      <p class="kc-lead">We couldn’t complete your request. The sign-in link may have expired, or the session is no longer valid.</p>

      <div style="margin-top:26px">
        <!-- ${client?? ? back-to-application : back-to-login} -->
        <a class="kc-btn primary" href="login.html">
          Back to sign in
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
        </a>
      </div>

      <!-- a quiet reference for support — Keycloak error pages often carry a ref -->
      <div class="kc-card-foot">
        <span class="kc-mono" style="font-size:11px;letter-spacing:.04em;color:var(--c-faint)">ref · 7b3f9c2a · 2026-06-06 11:04 UTC</span>
      </div>
    </div>

    <span class="kc-back" style="cursor:default">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
      If this keeps happening, contact your kumbuka admin.
    </span>

  </div>
</div>
</body>
</html>
