<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · kumbuka.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../keycloak.css">
</head>
<body>
<!-- maps to: login-reset-password.ftl  (template "login-reset-password") — forgot-password request -->
<div class="kc-page">
  <div class="kc-shell">
    <div class="kc-brand">
      <img src="../../../assets/brand/kumbuka-mark.svg" alt="">
      <div><div class="wordmark">kumbuka<span class="dot">.ai</span></div><span class="sub">memory console</span></div>
    </div>

    <div class="kc-card">
      <span class="kc-eyebrow">// reset password</span>
      <h1 class="kc-title">Forgot your password?</h1>
      <p class="kc-lead">Enter your email or username. If there’s an account, we’ll send a link to set a new password.</p>

      <!-- #kc-reset-password-form -->
      <form class="kc-form" action="#" method="post" onsubmit="return false" style="margin-top:26px">
        <div class="kc-field">
          <label class="kc-label" for="username">Email or username</label>
          <input class="kc-input mono" id="username" name="username" type="text" autocomplete="username" autofocus spellcheck="false" placeholder="you@kumbuka.ai">
        </div>
        <button class="kc-btn primary" type="submit">
          Send reset link
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>

    <a class="kc-back" href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 5l-7 7 7 7"/></svg>
      Back to sign in
    </a>
  </div>
</div>
</body>
</html>
