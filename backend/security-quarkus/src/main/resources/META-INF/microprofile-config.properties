# A METHOD WITHOUT A DECLARED PERMISSION IS REFUSED. On every bean that
# declares a permission on any of its methods, a public method that declares
# none is denied by the framework, so a facade method someone forgot to
# declare is refused rather than open. The facade conformance guard reports
# the same method in the service's tests.
quarkus.security.deny-unannotated-members=true
