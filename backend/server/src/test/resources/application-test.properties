# ===========================================================================
# Test-profile config file (Quarkus loads application-{profile}.properties for
# the active profile). Profile-specific values here override the bare keys in
# application.properties for the "test" profile — which is what we need for the
# runtime OIDC auth-server-url, where two same-ordinal application.properties
# sources only tie (and the main file's expression wins the tie).
# ===========================================================================

# E2EOAuthIntegrationIT re-enables the mcp tenant (OidcEnabledProfile) and points
# it at the fixed-port test Keycloak (KeycloakTestResource HOST_PORT=38080).
# Harmless for the OIDC-disabled data-layer tests — a disabled tenant is never
# contacted.
quarkus.oidc.mcp.auth-server-url=http://localhost:38080/realms/kumbuka
