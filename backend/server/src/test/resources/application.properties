# ===========================================================================
# Test profile — disables external integrations not needed by repository tests.
#   - OIDC tenants disabled (no Keycloak required for data-layer tests)
#   - Keycloak Admin Client points at a no-op URL
#   - No JDBC URL set → DevServices spins up a Postgres container automatically
# ===========================================================================

quarkus.oidc.mcp.tenant-enabled=false
quarkus.oidc.admin.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
quarkus.keycloak.admin-client.server-url=http://localhost:0

# Tenant id matches the V1__init.sql seed row.
kumbuka.public-base-url=http://localhost:8081
kumbuka.tenant-id=00000000-0000-0000-0000-000000000001

# Disable the background scope_stats refresher (V6) in tests — the test
# that exercises it (ScopeStatsRefresherIT) invokes the bean directly.
# Avoids race conditions with other ITs sharing the DevServices Postgres.
quarkus.scheduler.enabled=false

# Erase-subject internal endpoint — token set so the happy-path/auth tests
# can exercise the configured branches. The 503-when-unset case lives in
# its own @TestProfile.
kumbuka.internal.erasure.token=test-erase-token
kumbuka.internal.erasure.tombstone-subject=__former-member__

# System-guidance overlay: default-profile tests exercise the BUNDLED default,
# so pin the external file path at a location that never exists — this keeps the
# bundled-default tests deterministic even if a stray /etc file is present on the
# build host. The external-file path is exercised by GuidanceExternalFileReadPathTest,
# which overrides this via its own @TestProfile.
kumbuka.system-guidance.path=/nonexistent/kumbuka/system-conventions.json

# ===========================================================================
# Where the tables are, for tests
#
# Since V23 the tenancy inventory lives in the schema `platform` while `memory`
# and `content_relation` stay in `public`. Nothing in the IMAGE says so: the
# entities are mapped without a schema and the raw SQL is unqualified, both on
# purpose, so that one image runs against a database on either side of the move.
# What tells them apart is the search_path, and in production that sits on the
# database ROLE (init-db.sh for a fresh install, deploy/upgrade/ for an existing
# one). DevServices hands out its own role, so the tests have to supply the same
# thing here — this is the test-side stand-in for that role setting, not a
# second source of truth.
#
# Same order as production: `platform` first, `public` behind it.
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=platform,public

# Flyway's history location is pinned EXPLICITLY here, and only here.
#
# Flyway with no schema configured keeps its history in current_schema() — the
# first entry of the search_path above. In production that is `platform`,
# because the upgrade script moves the history and the migrator's search_path in
# one transaction. Tests have no such step: the history is created on the first
# boot, when `platform` does not exist yet, so it lands in `public` — and every
# LATER boot against the same DevServices database would then look in
# `platform`, find no history, and (with baseline-on-migrate off, as it now is)
# refuse to start. Naming the schema keeps the history in one place for the
# whole suite.
#
# This key is deliberately absent from the deployable's configuration and must
# stay absent: a `default-schema` baked into the image breaks fresh installs,
# because V21 creates `platform` itself and Flyway would have created it first
# (measured against Flyway 12.0.0).
quarkus.flyway.default-schema=public
