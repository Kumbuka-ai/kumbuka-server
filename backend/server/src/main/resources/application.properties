# ===========================================================================
# kumbuka.ai backend
# ===========================================================================

quarkus.application.name=kumbuka-server
quarkus.http.port=8080

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."ai.kumbuka".level=DEBUG

# ---------------------------------------------------------------------------
# Datasource (PostgreSQL)
# ---------------------------------------------------------------------------
# Credentials + URL are supplied via env vars in docker-compose
# (QUARKUS_DATASOURCE_USERNAME / _PASSWORD / _JDBC_URL). When those env vars
# are absent (e.g. local `mvn test`), Quarkus DevServices spins up a
# Postgres container automatically and supplies the URL itself.
quarkus.datasource.db-kind=postgresql

# Flyway runs before Hibernate; Hibernate only validates the schema.
quarkus.flyway.migrate-at-start=true
# Baseline-on-migrate is OFF, and that is a safety property, not a preference.
# With it ON, Flyway that finds no history in the schema its migrator's
# search_path points at does not refuse — it writes a fresh history, baselines
# it at version 1, and starts replaying the chain from V2 against whatever
# objects are already there. Measured against Flyway 12.0.0 on a
# database whose search_path had moved to `platform, public` while the history
# was still in `public`: Flyway created a SECOND history in `platform`, marked
# it baseline 1, and only then died on a collision — leaving two histories with
# contradictory content and no error anyone saw until that point. That
# half-state is exactly what an interrupted or out-of-order Stage-F upgrade
# produces, so the setting that hides it has to go. With it OFF the same
# situation is a loud refusal before anything is written.
#
# What this costs: a database that genuinely has objects but no history can no
# longer be adopted by simply starting the application. That is the intended
# trade — adopting such a database is an explicit act, not a side effect of a
# container start.
quarkus.flyway.baseline-on-migrate=false
# The tenant-binding Flyway callback is registered HERE, by fully qualified
# class name, and nowhere else. quarkus-flyway resolves callbacks from this key
# and instantiates them reflectively through the no-argument constructor
# (FlywayCallbacksLocator#callbacksForDataSource); it does NOT discover them as
# CDI beans. A callback that is written, annotated and left out of this line is
# never registered - no warning, no error, and every migration runs without it.
#
# This line also governs the composed enterprise image, which bundles this
# module as a library jar. Measured against Quarkus 3.33.2: Quarkus MERGES the
# application.properties of a dependency jar with the deployable's own, so a key
# set only here is resolved there too; the deployable's file wins only for the
# keys it sets itself, and it does not set this one.
quarkus.flyway.callbacks=ai.kumbuka.tenancy.TenantyMigrationCallback
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
# JSONB columns (governance_audit.payload) serialize via Hibernate's own
# built-in JSON facility, NOT the REST ObjectMapper. Reusing the REST mapper for
# DB columns is what Quarkus warns against (and refuses by default). `ignore`
# is the documented fix and the future Quarkus default.
quarkus.hibernate-orm.mapping.format.global=ignore

# Multi-tenancy seam — Hibernate filters on @TenantId at the ORM level.
# Layer 2 is Postgres RLS (see V3__tenancy_rls.sql + TenantDatabaseBinding).
# The current-tenant lookup goes through ai.kumbuka.tenancy.HibernateTenantResolver,
# which delegates to TenantContext.current() (ADR-0011).
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# Hibernate's @TenantId filter sends the tenant identifier as the entity
# field type (String here, because Quarkus' TenantResolver SPI is
# String-only). The DB column is `uuid`. pgjdbc would normally tag the
# parameter as VARCHAR and Postgres would reject `uuid = varchar`. Tell
# pgjdbc not to advertise a JDBC type so Postgres infers `uuid` from the
# column context.
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# ---------------------------------------------------------------------------
# OIDC — one named tenant. The default tenant is disabled;
# PathBasedTenantResolver picks `admin` for /api/admin and /api/auth.
#
# A second tenant, `mcp`, carried the bearer / resource-server half until the
# memory engine left the core. It is gone with the surface it protected, and so
# is the http auth permission that enforced a 401 on /mcp.
# ---------------------------------------------------------------------------
quarkus.oidc.tenant-enabled=false

# --- Tenant: admin (web-app / BFF) -----------------------------------------
quarkus.oidc.admin.auth-server-url=${KUMBUKA_OIDC_ISSUER:https://dev.kumbuka.ai/auth/realms/kumbuka}
quarkus.oidc.admin.client-id=${KUMBUKA_ADMIN_CLIENT_ID:kumbuka-admin}
quarkus.oidc.admin.credentials.secret=${KUMBUKA_ADMIN_CLIENT_SECRET:change-me-kumbuka-admin-secret}
quarkus.oidc.admin.application-type=web-app
quarkus.oidc.admin.authentication.redirect-path=/api/auth/callback
# After OIDC callback, return to the original protected request URL so
# /api/auth/login?return_to=… can hand control back to the SPA (ADR-0009).
quarkus.oidc.admin.authentication.restore-path-after-redirect=true
quarkus.oidc.admin.authentication.cookie-force-secure=true
# Quarkus' own redirect-uri builder ignores X-Forwarded-Proto when it sees a
# plaintext http listener (it listens on 8080 behind Caddy). Force https on
# the absolute redirect_uri it sends to Keycloak. (Local dev + production
# both terminate TLS in front of the backend.)
quarkus.oidc.admin.authentication.force-redirect-https-scheme=true
quarkus.oidc.admin.authentication.cookie-same-site=lax
quarkus.oidc.admin.authentication.pkce-required=true
quarkus.oidc.admin.logout.path=/api/auth/logout
quarkus.oidc.admin.logout.post-logout-path=/
quarkus.oidc.admin.token-state-manager.strategy=keep-all-tokens
# Silently refresh the admin (console BFF) session when its access token
# expires, using the stored refresh token. The realm's accessTokenLifespan is
# 5 min and the admin client issues refresh tokens, but without this Quarkus
# never uses them: the first request after 5 min 401s and the console bounces
# to /signin. With refresh-expired the session follows the SSO session instead
# — an active session is refreshed silently up to the SSO max lifespan, and only
# once the refresh token itself expires (SSO idle/max timeout) does the user get
# a clean re-login. refresh-token-time-skew refreshes slightly ahead of expiry
# so a request landing on the boundary doesn't race a just-expired token.
quarkus.oidc.admin.token.refresh-expired=true
quarkus.oidc.admin.token.refresh-token-time-skew=30S
# The audit actor on the console path must be the KC `sub` (stable UUID), NOT
# preferred_username (email): the web-app tenant defaults to an
# upn → preferred_username → sub fall-through, so console writes would stamp
# email — which the sub-keyed erasure (strict equality) would then never match.
# Pin it; OidcPrincipalClaimGuard enforces it.
quarkus.oidc.admin.token.principal-claim=sub
quarkus.oidc.admin.roles.source=accesstoken
quarkus.oidc.admin.roles.role-claim-path=realm_access/roles
# Local-dev TLS bypass: Caddy issues an internal CA cert for
# auth.dev.kumbuka.ai, so Quarkus' back-channel calls to that hostname
# (discovery, JWKS, token exchange) would fail TLS verification before the
# operator has trusted Caddy's root. %dev ONLY; prod terminates the back-channel
# at the in-stack Caddy edge against the publicly-trusted Let's Encrypt wildcard
# cert, which the default trust store verifies — no bypass needed.
%dev.quarkus.oidc.admin.tls.verification=none

# ---------------------------------------------------------------------------
# Keycloak Admin REST client (service account: kumbuka-backend)
# ---------------------------------------------------------------------------
quarkus.keycloak.admin-client.server-url=${KUMBUKA_KEYCLOAK_URL:https://dev.kumbuka.ai/auth}
quarkus.keycloak.admin-client.realm=kumbuka
quarkus.keycloak.admin-client.client-id=${KUMBUKA_BACKEND_CLIENT_ID:kumbuka-backend}
quarkus.keycloak.admin-client.client-secret=${KUMBUKA_BACKEND_CLIENT_SECRET:change-me-kumbuka-backend-secret}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# ---------------------------------------------------------------------------
# Kumbuka app config (read by ai.kumbuka.config.MemoryConfig).
# writePolicy / defaultScope / createScopes are runtime settings, stored in
# the `team_settings` table; they don't appear here.
# ---------------------------------------------------------------------------
# Trust X-Forwarded-* headers coming from Caddy so Quarkus builds absolute
# URLs (redirect_uri, OIDC callback, etc.) with the public scheme + host.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

kumbuka.public-base-url=${KUMBUKA_PUBLIC_BASE_URL:https://dev.kumbuka.ai}
# The connector endpoint the console shows the team, and the SaaS/CE signal.
# Empty (the CE default) = no endpoint is shown: this service does not serve a
# connector surface, so it has none of its own to name. The hosted image sets
# this to the generic platform endpoint.
kumbuka.mcp.public-url-template=${KUMBUKA_MCP_PUBLIC_URL_TEMPLATE:}
kumbuka.auth-base-url=${KUMBUKA_AUTH_BASE_URL:https://auth.dev.kumbuka.ai}
kumbuka.realm=${KUMBUKA_REALM:kumbuka}
kumbuka.connector-client-id=${KUMBUKA_CONNECTOR_CLIENT_ID:kumbuka-connector}

# Singleton-tenant id (matches the seed row in V1__init.sql).
kumbuka.tenant-id=00000000-0000-0000-0000-000000000001

# ---------------------------------------------------------------------------
# Internal erase-subject endpoint (ADR-0015)
# Server-to-server only; bearer-token auth. Unset on the host => endpoint
# refuses with 503. Set this to the same value as the provider's
# `ops.oss.erase-subject-token` (env: OPS_OSS_ERASE_SUBJECT_TOKEN).
# ---------------------------------------------------------------------------
kumbuka.internal.erasure.token=${KUMBUKA_INTERNAL_ERASURE_TOKEN:}
kumbuka.internal.erasure.tombstone-subject=${KUMBUKA_INTERNAL_ERASURE_TOMBSTONE:__former-member__}

# ---------------------------------------------------------------------------
# Health / readiness
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health

# ---------------------------------------------------------------------------
# JaCoCo (test scope only — quarkus-jacoco extension)
# ---------------------------------------------------------------------------
# The quarkus-jacoco test extension reads these. Without them @QuarkusTest
# classes execute through a separate classloader and their coverage is lost.
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.reuse-data-file=true
