# kumbuka — Keycloak account-console theme
# The new account console is a React + PatternFly v5 app shipped under
# parent theme `keycloak.v3` in Keycloak 26. We do NOT fork the React
# app — we override the brand and theme via PatternFly CSS variables
# plus a logo. If a brand request can't be expressed through these
# variables, flag it for follow-up rather than swapping the JS bundle.

parent=keycloak.v3
import=common/keycloak

styles=css/account.css

# Locales: English only for now.
locales=en

# Logo + favicon paths are picked up by the React shell from theme
# properties. The logo above points at our white-knockout mark; the link
# returns the user to the kumbuka console.
logo=img/kumbuka-mark-white.svg
logoUrl=/
