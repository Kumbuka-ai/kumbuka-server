# kumbuka — login theme: brand-level message overrides
#
# Strings live in three layers, in priority order:
#   1. This file        — overrides the brand actually changes the wording of.
#   2. keycloak.v2      — the canonical strings, kept verbatim unless overridden.
#   3. base             — Keycloak's English fallback.
#
# DO NOT add a key here unless the brand truly speaks differently. The
# default Keycloak strings are correct and cover edge cases (account lock,
# webauthn errors, x509 prompts, etc.) we don't want to silently drop.

# Document <title> — appended with the realm display name by template.ftl.
loginTitle=Sign in
loginTitleHtml=Sign in
loginAccountTitle=Sign in to {0}

# Brand sub-line shown under the wordmark on every page.
kumbukaBrandSub=memory console

# Context-line text shown in the card head (e.g. "Continue to <b>kumbuka memory console</b>").
kumbukaContinueTo=Continue to

# Identity-first flow (login-username.ftl → login-password.ftl). The password
# step shows which identifier is being signed in with + a restart affordance.
kumbukaSigningInAs=Signing in as
kumbukaNotYou=not you?

# Card eyebrows — short uppercase tags, one per page.
kumbukaEyebrowSignIn=// sign in
kumbukaEyebrowReset=// reset
kumbukaEyebrowUpdatePassword=// update password
kumbukaEyebrowUpdateProfile=// update profile
kumbukaEyebrowOtp=// one-time code
kumbukaEyebrowConfigOtp=// set up authenticator
kumbukaEyebrowChooseMethod=// choose method
kumbukaEyebrowWebauthn=// security key
kumbukaEyebrowRegisterWebauthn=// register security key
kumbukaEyebrowTerms=// terms
kumbukaEyebrowVerifyEmail=// verify email
kumbukaEyebrowExpired=// page expired
kumbukaEyebrowError=// error
kumbukaEyebrowInfo=// info
kumbukaEyebrowLogout=// sign out

# Footer.
kumbukaSecuredBy=secured by keycloak

# Self-registration is not enabled on this realm, but the slot is in the
# markup so it's a one-line config flip later. The wording is brand-voiced.
kumbukaNoRegistrationCopy=Accounts are created by an admin —
kumbukaRequestAccess=request access

# Private-memory reassurance shown on the invite-flow update-password and
# email-verification pages (mirrors the console's five-surface rule).
kumbukaPrivateAssurance=Your private memory will be yours alone — it is never shown to admins or in the team console.

# info.ftl proceed CTA. Keycloak's default is "&raquo; Click here to proceed":
# our info.ftl renders it with ${msg(...)} (HTML-escaped, no ?no_esc), so the
# literal entity showed as "&RAQUO;" on the button (uppercased by the theme).
# The template already appends a → arrow, so drop the entity and keep the words.
proceedWithAction=Click here to proceed

# Same escaping issue: Keycloak's default is "&laquo; Back to Application".
# The theme renders the «-entity literally too. Drop it (the templates carry
# their own arrow affordance).
backToApplication=Back to application
