# kumbuka — Keycloak login theme
# Inherits from keycloak.v2 (the modern login theme in KC 26) and overrides
# only what the brand changes. The base remains responsible for form
# semantics (action URLs, field names, hidden inputs, message bundles).

parent=keycloak.v2
import=common/keycloak

# Single brand stylesheet. Keep the base's stylesheet by NOT including it
# in `styles=` — the parent already declares it.
styles=css/kumbuka.css
scripts=js/kumbuka.js

# Locales: English only for now; the structure is in place for more.
locales=en

# Class-name knobs read by user-profile macros + alert helpers. The
# rest the CSS owns; we keep these aligned with our own selectors so
# dynamically-rendered fields (user-profile, register, …) inherit
# kumbuka styling without an extra wrapper.
kcHtmlClass=
kcLoginClass=
kcFormGroupClass=kc-field
kcLabelClass=kc-label
kcInputClass=kc-input
kcInputWrapperClass=
kcLabelWrapperClass=
kcFormButtonsClass=
kcButtonClass=kc-btn
kcButtonPrimaryClass=primary
kcButtonDefaultClass=
kcButtonLargeClass=
kcButtonBlockClass=
kcInputErrorMessageClass=kc-input-error
kcFeedbackErrorClass=kc-alert error
kcFeedbackWarningClass=kc-alert warn
kcFeedbackSuccessClass=kc-alert success
kcFeedbackInfoClass=kc-alert info
