# kumbuka — transactional email theme: brand wording.
#
# Keycloak references these via ${msg("...")} inside the html/text
# templates. Subjects are sent through the same bundle.

# Subjects.
executeActionsSubject=You're invited to kumbuka.ai
emailVerificationSubject=Verify your kumbuka.ai email
passwordResetSubject=Reset your kumbuka.ai password

# Body fragments shared across templates.
kumbukaBrandSub=memory console
kumbukaPrivacyFooter=kumbuka.ai · open-source memory for AI assistants
kumbukaPrivateAssurance=Your private memory is yours alone — kumbuka never shows it to admins or in the team console.

# Invite (executeActions) body.
executeActionsBodyHtml=An admin invited you to the <b>kumbuka.ai</b> workspace. Set up your account to start reading and writing your team's shared memory.
executeActionsBodyText=An admin invited you to the kumbuka.ai workspace. Set up your account to start reading and writing your team's shared memory.
executeActionsCta=Set up your account
executeActionsExpires=This invitation expires in {0}.

# Verify-email body.
emailVerificationBodyHtml=Confirm this is your email so kumbuka can keep your sign-in working.
emailVerificationBodyText=Confirm this is your email so kumbuka can keep your sign-in working.
emailVerificationCta=Verify email

# Password-reset body.
passwordResetBodyHtml=Someone asked to reset the password on your <b>kumbuka.ai</b> account. If that was you, choose a new one. If not, you can ignore this email.
passwordResetBodyText=Someone asked to reset the password on your kumbuka.ai account. If that was you, choose a new one. If not, you can ignore this email.
passwordResetCta=Set a new password
