name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------
  # Re-run the full test suite at release time. We never publish a tag
  # whose tests didn't pass — even if main was green when the tag was
  # cut, the tagged tree could be different (or a transitive dependency
  # might have shifted).
  # ---------------------------------------------------------------------
  verify:
    name: verify (re-run tests at tag)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - working-directory: backend
        run: mvn -B -ntp -Pintegration verify

  # ---------------------------------------------------------------------
  # SPI + server jars → GitHub Packages Maven.
  #   ai.kumbuka:kumbuka-spi:{tag-stripped-of-v, …}
  #   ai.kumbuka:kumbuka-server:{tag-stripped-of-v, …}     (from v0.4.0)
  #
  # The commercial multi-tenant edition (ops-console) consumes the SPI for
  # the frozen TenantResolver contract AND consumes kumbuka-server as a
  # plain Maven library so its saas-runtime/ module can overlay the
  # request-aware resolver bean.
  # ---------------------------------------------------------------------
  maven-publish:
    name: maven · deploy spi + server to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # setup-java writes a settings.xml that authenticates the
          # `github` server (the id we use in distributionManagement)
          # with the GITHUB_TOKEN. No secrets indirection needed.
          server-id: github
          server-username: GITHUB_ACTOR_FOR_MAVEN
          server-password: GITHUB_TOKEN_FOR_MAVEN

      - id: meta
        name: derive version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "$REF" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="$INPUT_TAG"
          fi
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Set parent + spi + server version to the release version
        working-directory: backend
        run: |
          mvn -B -ntp versions:set \
              -DnewVersion=${{ steps.meta.outputs.version }} \
              -DprocessAllModules=true \
              -DgenerateBackupPoms=false

      - name: Deploy spi + server to GitHub Packages
        working-directory: backend
        env:
          GITHUB_ACTOR_FOR_MAVEN: ${{ github.actor }}
          GITHUB_TOKEN_FOR_MAVEN: ${{ secrets.GITHUB_TOKEN }}
        # -pl spi,server -am builds the parent + both modules and
        # deploys them. The server module ALSO continues to ship as a
        # docker image (backend-image job below) — Maven publish makes
        # it consumable as a library by ops-console/saas-runtime/ so the
        # SaaS image can overlay the request-aware resolver bean
        # We skip Quarkus' build-time native augmentation
        # during deploy: -Dquarkus.build.skip=true keeps the publish a
        # plain library jar.
        run: mvn -B -ntp -DskipTests -Dquarkus.build.skip=true -pl spi,server -am deploy

  # ---------------------------------------------------------------------
  # Backend image: ghcr.io/<owner>/kumbuka-backend:{tag,latest}
  # ---------------------------------------------------------------------
  backend-image:
    name: backend · build & push
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: derive tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "$REF" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="$INPUT_TAG"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "owner=$(printf "%s" "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/kumbuka-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/kumbuka-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/kumbuka-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # The Keycloak image is built & released from its own repository since
  # github.com/kumbuka-ai/kumbuka-keycloak (versioned independently
  # via KEYCLOAK_VERSION). It is no longer built here.

  # ---------------------------------------------------------------------
  # GitHub Release with auto-generated notes + image coordinates.
  # ---------------------------------------------------------------------
  github-release:
    name: github release
    needs: [maven-publish, backend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ -z "$REF" ] || [ "$REF" = "$GITHUB_REF" ]; then
            REF="$INPUT_TAG"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "owner=$(printf "%s" "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - name: gh release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          OWNER="${{ steps.meta.outputs.owner }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "
          ## Container images

          \`\`\`
          ghcr.io/$OWNER/kumbuka-backend:$TAG
          \`\`\`

          The Keycloak image is released separately and pinned via
          \`KEYCLOAK_VERSION\` in deploy.env — see
          github.com/$OWNER/kumbuka-keycloak.

          ## Maven artifact (GitHub Packages)

          The frozen tenancy SPI (consumed by the commercial multi-tenant edition):

          \`\`\`xml
          <dependency>
              <groupId>ai.kumbuka</groupId>
              <artifactId>kumbuka-spi</artifactId>
              <version>$VERSION</version>
          </dependency>
          \`\`\`

          Repository: \`https://maven.pkg.github.com/$OWNER/kumbuka-server\`

          Pull the matching console image from \`kumbuka-console\` for end-to-end deploys."
