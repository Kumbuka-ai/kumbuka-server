# TEMPORARY measurement workflow — removed by a follow-up commit before this
# branch is merged. Its runs stay in the branch's Actions history as evidence.
#
# A gate that has never been observed red is not a gate. This workflow drives the
# SHIPPED gate logic (extracted verbatim from migration-immutability.yml, so it
# tests the real code, not a copy) under three planted conditions and asserts
# each reaches its predicted outcome. The measurement itself fails loud: if a
# prediction is not met, the job fails.
name: migration hygiene probes (temporary)

on:
  push:
    branches: ['feature/migration-immutability-gate']

permissions:
  contents: read

jobs:
  # Predict: GREEN. The gate passes on the clean branch, in the real CI checkout.
  sanity-green:
    name: probe · clean HEAD is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: extract the shipped gate logic
        run: |
          awk '/python3 - <</{f=1;next} /^[[:space:]]*PY[[:space:]]*$/{f=0} f' \
            .github/workflows/migration-immutability.yml | sed 's/^          //' > /tmp/gate.py
          echo "--- extracted gate.py (head) ---"; sed -n '1,8p' /tmp/gate.py
      - name: run gate on clean HEAD (predict: green, exit 0)
        run: |
          set +e; out=$(python3 /tmp/gate.py); rc=$?; set -e
          printf '%s\n' "$out"; echo "observed exit=$rc"
          test "$rc" -eq 0 || { echo "MEASUREMENT FAIL: expected the gate to pass (exit 0)"; exit 1; }
          echo "PREDICTION MET: clean HEAD is green"

  # Predict: RED. Editing an already-applied migration must be rejected with M.
  red-on-edit:
    name: probe · editing an applied migration is red
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: extract the shipped gate logic
        run: |
          awk '/python3 - <</{f=1;next} /^[[:space:]]*PY[[:space:]]*$/{f=0} f' \
            .github/workflows/migration-immutability.yml | sed 's/^          //' > /tmp/gate.py
      - name: plant a comment edit on an applied migration, expect red
        run: |
          git config user.email "probe@example.invalid"
          git config user.name "migration hygiene probe"
          f=$(git ls-files '*/db/migration/*.sql' '*/db/ee-migration/*.sql' | head -1)
          printf '\n-- transient probe comment (measurement only)\n' >> "$f"
          git commit -qam "probe: edit an already-applied migration"
          set +e; out=$(python3 /tmp/gate.py); rc=$?; set -e
          printf '%s\n' "$out"; echo "observed exit=$rc"
          test "$rc" -eq 1 || { echo "MEASUREMENT FAIL: expected the gate to reject (exit 1)"; exit 1; }
          printf '%s\n' "$out" | grep -qP "^  M\t$f\$" || { echo "MEASUREMENT FAIL: expected 'M<TAB>$f' in the report"; exit 1; }
          echo "PREDICTION MET: gate went red with M on $f"

  # Predict: GREEN twice. Adding a new migration is allowed; deleting a file that
  # never existed at the baseline is not a violation either.
  green-on-new:
    name: probe · adding then deleting a new migration is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: extract the shipped gate logic
        run: |
          awk '/python3 - <</{f=1;next} /^[[:space:]]*PY[[:space:]]*$/{f=0} f' \
            .github/workflows/migration-immutability.yml | sed 's/^          //' > /tmp/gate.py
      - name: add a new migration then delete it, expect green both times
        run: |
          git config user.email "probe@example.invalid"
          git config user.name "migration hygiene probe"
          d=$(git ls-files '*/db/migration/*.sql' '*/db/ee-migration/*.sql' | head -1 | xargs dirname)
          nf="$d/V999999__probe_throwaway.sql"
          echo "-- throwaway probe migration (measurement only)" > "$nf"
          git add -A && git commit -qm "probe: add a new migration"
          set +e; out=$(python3 /tmp/gate.py); rc=$?; set -e
          printf '%s\n' "$out"; echo "observed exit(add)=$rc"
          test "$rc" -eq 0 || { echo "MEASUREMENT FAIL: adding a new migration should be green"; exit 1; }
          git rm -q "$nf" && git commit -qm "probe: delete the new migration"
          set +e; out=$(python3 /tmp/gate.py); rc=$?; set -e
          printf '%s\n' "$out"; echo "observed exit(delete)=$rc"
          test "$rc" -eq 0 || { echo "MEASUREMENT FAIL: deleting a never-baselined file should be green"; exit 1; }
          echo "PREDICTION MET: add and delete-of-new are both green"

  # Predict: RED. Under the WRONG checkout config (shallow, no tags) the baseline
  # is unresolvable and the gate must fail loud instead of waving through.
  red-on-missing-baseline:
    name: probe · missing baseline is red, not silently green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
      - name: extract the shipped gate logic
        run: |
          awk '/python3 - <</{f=1;next} /^[[:space:]]*PY[[:space:]]*$/{f=0} f' \
            .github/workflows/migration-immutability.yml | sed 's/^          //' > /tmp/gate.py
      - name: run gate with no reachable tag (predict: red, exit 1, baseline message)
        run: |
          echo "tags visible: [$(git tag --list | tr '\n' ' ')]"
          set +e; out=$(python3 /tmp/gate.py); rc=$?; set -e
          printf '%s\n' "$out"; echo "observed exit=$rc"
          test "$rc" -eq 1 || { echo "MEASUREMENT FAIL: expected the gate to reject a missing baseline (exit 1)"; exit 1; }
          printf '%s\n' "$out" | grep -q "no release tag is reachable" || { echo "MEASUREMENT FAIL: expected the baseline message"; exit 1; }
          echo "PREDICTION MET: missing baseline is red with the baseline message"
