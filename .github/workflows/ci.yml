name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------
  # Backend: full Maven verify, surefire + failsafe (-Pintegration).
  # The integration profile picks up CrossTenantIsolationIT, which boots
  # Postgres in a Testcontainers container — GitHub-hosted runners have
  # Docker available.
  # ---------------------------------------------------------------------
  backend:
    name: backend · mvn verify -Pintegration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Print versions
        run: |
          java -version
          mvn -version
          docker version

      - name: mvn verify -Pintegration
        working-directory: backend
        run: mvn -B -ntp -Pintegration verify

      - name: Upload surefire + failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/server/target/surefire-reports/**
            backend/server/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Caddyfile syntax check — cheap, catches typos in PR diffs.
  # ---------------------------------------------------------------------
  caddyfile:
    name: caddyfile · validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: caddy validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e KUMBUKA_DOMAIN=ci.example \
            -e KC_HOSTNAME=auth.ci.example \
            -e ACME_EMAIL=ci@example.invalid \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ---------------------------------------------------------------------
  # docker-compose config-only render to catch yaml / env mistakes.
  # ---------------------------------------------------------------------
  compose:
    name: compose · render config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: compose config (app profile)
        run: |
          cp .env.example .env
          docker compose --profile app config > /dev/null
      - name: compose config (prod-kc profile)
        run: |
          docker compose --profile app --profile prod-kc config > /dev/null

  # ---------------------------------------------------------------------
  # SonarQube Cloud analysis. Runs alongside the test job (not after) so
  # a failing scan does not gate the rest of CI. Java needs compiled
  # bytecode → `mvn -DskipTests compile` then `sonarqube-scan-action`.
  # Requires SONAR_TOKEN secret + Automatic Analysis turned OFF in the
  # Sonar UI (Project → Analysis Method → CI-based).
  # ---------------------------------------------------------------------
  sonar:
    name: code quality · SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for accurate new-code / blame attribution.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify -Pintegration` so JaCoCo's exec files are produced (both
      # the plain unit-test target/jacoco.exec and the @QuarkusTest
      # target/jacoco-quarkus.exec) and merged into the XML report at
      # target/site/jacoco/jacoco.xml — picked up by the scan-action
      # via sonar.coverage.jacoco.xmlReportPaths in sonar-project.properties.
      - name: backend verify (compile + tests + jacoco)
        working-directory: backend
        run: mvn -B -ntp -Pintegration verify

      # Diagnose path mapping between jacoco.xml and sonar.sources.
      - name: debug — jacoco.xml shape
        run: |
          XML=backend/server/target/site/jacoco/jacoco.xml
          if [ ! -f "$XML" ]; then echo "no jacoco.xml"; exit 0; fi
          echo "=== file size ==="
          wc -c "$XML"
          echo ""
          echo "=== first 3 package elements ==="
          grep -oE '<package name="[^"]+"' "$XML" | head -3
          echo ""
          echo "=== sample sourcefile elements (first 5) ==="
          grep -oE '<sourcefile name="[^"]+"' "$XML" | head -5
          echo ""
          echo "=== sample <line> counters (proves data is in XML, not just structure) ==="
          grep -oE '<line nr="[0-9]+" mi="[0-9]+" ci="[0-9]+"[^/]*/' "$XML" | head -5
          echo ""
          echo "=== total coverage counters (final aggregate) ==="
          grep -oE '<counter type="[A-Z]+" missed="[0-9]+" covered="[0-9]+"/>' "$XML" | tail -10

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: -X
