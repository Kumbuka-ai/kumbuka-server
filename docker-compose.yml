# ---------------------------------------------------------------------------
# docker-compose.yml — kumbuka.ai (Phase 0 skeleton)
#
# Only `caddy` publishes ports on the host. All other services bind to the
# internal `internal` network only.
#
# Backend / frontend services use `build` placeholders; the Dockerfiles arrive
# in Phase 2 / Phase 6. Until then `just up` brings up postgres + keycloak +
# caddy for OIDC bring-up work.
# ---------------------------------------------------------------------------

name: kumbuka-ai

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by init-db.sh
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KUMBUKA_DB_USER: ${KUMBUKA_DB_USER}
      KUMBUKA_DB_PASSWORD: ${KUMBUKA_DB_PASSWORD}
      KUMBUKA_DB_NAME: ${KUMBUKA_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Theme + realms now live in github.com/kumbuka-ai/kumbuka-keycloak and are
    # baked into this published image. Dev consumes the same image as
    # prod; theme/realm hacking happens in that repo (its docker-compose has a
    # build-and-verify loop). Dev test users are no longer seeded here — create
    # them via the admin console or kcadm against the running realm.
    image: ghcr.io/kumbuka-ai/kumbuka-keycloak:${KEYCLOAK_VERSION:-latest}
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${KC_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Realm secrets rendered into the baked imports by the image entrypoint.
      KUMBUKA_ADMIN_CLIENT_SECRET: ${KUMBUKA_ADMIN_CLIENT_SECRET}
      KUMBUKA_BACKEND_CLIENT_SECRET: ${KUMBUKA_BACKEND_CLIENT_SECRET}
      KUMBUKA_CONNECTOR_CLIENT_SECRET: ${KUMBUKA_CONNECTOR_CLIENT_SECRET}
      KUMBUKA_OPS_CLIENT_SECRET: ${KUMBUKA_OPS_CLIENT_SECRET:-dev-ops-secret}
      KUMBUKA_OPS_ADMIN_CLIENT_SECRET: ${KUMBUKA_OPS_ADMIN_CLIENT_SECRET:-dev-ops-admin-secret}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-dev-smtp-password}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  kumbuka-backend:
    # Build context arrives in Phase 2.
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${KUMBUKA_DB_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${KUMBUKA_DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${KUMBUKA_DB_PASSWORD}
      KUMBUKA_PUBLIC_BASE_URL: https://${KUMBUKA_DOMAIN}
      KUMBUKA_AUTH_BASE_URL: https://${KC_HOSTNAME}
      # Public issuer (what browsers see, what tokens carry). The backend
      # reaches it through the caddy network alias so the call stays inside
      # the docker network; quarkus.oidc.<tenant>.tls.verification=none lets
      # it accept Caddy's local-CA cert.
      KUMBUKA_OIDC_ISSUER: https://${KC_HOSTNAME}/realms/kumbuka
      # Keycloak Admin REST client — goes direct over HTTP to bypass TLS
      # entirely (we trust the internal network).
      KUMBUKA_KEYCLOAK_URL: http://keycloak:8080
      KUMBUKA_ADMIN_CLIENT_ID: ${KUMBUKA_ADMIN_CLIENT_ID}
      KUMBUKA_ADMIN_CLIENT_SECRET: ${KUMBUKA_ADMIN_CLIENT_SECRET}
      KUMBUKA_BACKEND_CLIENT_ID: ${KUMBUKA_BACKEND_CLIENT_ID}
      KUMBUKA_BACKEND_CLIENT_SECRET: ${KUMBUKA_BACKEND_CLIENT_SECRET}
      BACKEND_SESSION_SECRET: ${BACKEND_SESSION_SECRET}
      KUMBUKA_LOAD_CONTEXT_PER_TYPE_LIMIT: ${KUMBUKA_LOAD_CONTEXT_PER_TYPE_LIMIT}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    profiles: ["app"]

  # The admin console (Next.js BFF) lives in a separate repository:
  # github.com/kumbuka-ai/kumbuka-console. To wire it up locally, clone
  # that repo and add a service like the following to a compose
  # override file (e.g. compose.override.yml):
  #
  #   kumbuka-console:
  #     build: ../kumbuka-console        # or: image: ghcr.io/kumbuka-ai/kumbuka-console:latest
  #     environment:
  #       NEXT_PUBLIC_APP_NAME: kumbuka.ai
  #       KUMBUKA_BACKEND_URL: http://kumbuka-backend:8080
  #     networks: [internal]
  #     depends_on: [kumbuka-backend]
  #     profiles: ["app"]
  #
  # Caddy already proxies the root path to this hostname; if the service
  # isn't running, Caddy returns 502 — that's the expected "no console
  # deployed" state in a backend-only deployment.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KUMBUKA_DOMAIN: ${KUMBUKA_DOMAIN}
      KC_HOSTNAME: ${KC_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # Local-dev: make both public hostnames resolve to the Caddy container
      # from inside the docker network so the backend's OIDC discovery /
      # token-exchange calls reach Keycloak through the same TLS terminator
      # the browser uses. (See application.properties tls.verification=none.)
      internal:
        aliases:
          - ${KUMBUKA_DOMAIN}
          - ${KC_HOSTNAME}
    depends_on:
      - keycloak

  # ---------------------------------------------------------------------
  # Dev-only — MailHog catches all SMTP from Keycloak so we can render the
  # branded transactional emails (invite / verify / reset). Run with the
  # `dev-mail` profile, e.g. `docker compose --profile app --profile dev-mail up`.
  # UI at http://localhost:8025 once started.
  # ---------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal
    profiles: ["dev-mail"]

  # The former `prod-kc` profile (a locally-built baked Keycloak) is gone:
  # the dev `keycloak` service above now runs the same published image as
  # prod (github.com/kumbuka-ai/kumbuka-keycloak), so dev already
  # has prod parity. Pin a specific build with KEYCLOAK_VERSION.
