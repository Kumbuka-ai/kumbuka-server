# SonarQube Cloud — kumbuka-server (Quarkus/Java + ops scripts + design assets).
#
# Until the CI-based scan lands (Phase B), this file primarily configures
# exclusions for Automatic Analysis. CI-based scan adds sonar.sources +
# sonar.java.binaries in a follow-up PR.
sonar.organization=kumbuka-ai
sonar.projectKey=Kumbuka-ai_kumbuka-server

# Exclusions — context false-positives, not laziness:
#  - design/keycloak/email/*.html: HTML-email rendering requires <table>
#    layouts + deprecated attributes (width/cellpadding/cellspacing/bgcolor/
#    align). Mail clients ignore <style> in <head>; inline table attrs are
#    the only portable way to lay these out. Sonar's Web rules (S1827,
#    S5257, S6819) cannot distinguish web HTML from email HTML.
#  - design/keycloak/mockups/**: throwaway design references, never shipped.
#  - **/db/migration/**: Postgres/Flyway SQL. Sonar's plsql parser reads
#    these as Oracle PL/SQL and reports `VARCHAR` → `VARCHAR2` and
#    `S1192` duplicate-literal noise. Switching to `VARCHAR2` would break
#    Postgres. Migration files are forward-only and reviewed individually.
sonar.exclusions=design/**,**/db/migration/**
